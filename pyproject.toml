[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataroma-mcp"
version = "0.1.12"
description = "An MCP server for Dataroma to access superinvestor holdings and trades"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Temporarily pin mcp < 2.0.0 because fastmcp is currently broken by the MCPError rename in mcp 2.0.0
    "mcp<2.0.0",
    "fastmcp",
    "pydantic-settings",
    "beautifulsoup4",
    "requests"
]
authors = [
    { name = "Onefoot Hurdle", email = "onefoothurdle@gmail.com" }
]

[project.urls]
Homepage = "https://github.com/kmukul123/dataroma-mcp"
Repository = "https://github.com/kmukul123/dataroma-mcp"

[project.scripts]
dataroma-mcp = "dataroma_mcp:main"

[tool.setuptools]
py-modules = ["dataroma_mcp", "dataroma_scraper"]
