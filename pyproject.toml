[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataroma-mcp"
version = "0.1.16"
description = "An MCP server for Dataroma to access superinvestor holdings and trades"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pin mcp and fastmcp strictly to avoid upstream ecosystem breakages
    "mcp==1.29.0",
    "fastmcp==3.4.5",
    "pydantic-settings>=2.14.2,<3.0.0",
    "beautifulsoup4>=4.15.0,<5.0.0",
    "requests>=2.34.2,<3.0.0"
]
authors = [
    { name = "Onefoot Hurdle", email = "onefoothurdle@gmail.com" }
]

[project.urls]
Homepage = "https://github.com/kmukul123/dataroma-mcp"
Repository = "https://github.com/kmukul123/dataroma-mcp"

[project.scripts]
dataroma-mcp = "dataroma_mcp:main"

[tool.setuptools]
py-modules = ["dataroma_mcp", "dataroma_scraper"]
